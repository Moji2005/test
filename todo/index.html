<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="style/style.css" />
    <title>Todo app</title>
  </head>
  <body>
    <main>
      <div class="top-img"></div>
      <div class="contain">
        <div class="top-cntain">
          <h1>TODO</h1>
          <img src="images/icon-sun.svg" alt="" id="moodWeb" />
        </div>
        <div class="inp">
          <div class="chek">
            <!-- <img src="images/icon-check.svg" alt=""> -->
          </div>
          <input
            type="text"
            id="todo-name"
            class="input"
            placeholder="create new todo..."
          />
        </div>
        <div class="box-todo"></div>
        <div class="">
          <div class="btm-content" style="position: relative">
            <p id="items-some">5 items left</p>
            <ul class="ull">
              <li id="showAll" data-page="1" class="focus">All</li>
              <li id="showActive" data-page="2">Active</li>
              <li id="showComp" data-page="3">Completed</li>
            </ul>
            <p id="delComp">Clear Completed</p>
            <div
              class="mm"
              style="position: absolute; top: 5rem; width: 100%; left: 0"
            >
              <ul>
                <li id="showAll1" data-page="1" class="focus">All</li>
                <li id="showActive1" data-page="2">Active</li>
                <li id="showComp1" data-page="3">Completed</li>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
